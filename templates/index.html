<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kill-ELO — Global PvP Leaderboard</title>
<meta name="description" content="Live global leaderboard for the Kill-ELO Minecraft mod. Chess-style Elo rating for PvP, built from the kill messages in chat.">
<meta property="og:title" content="Kill-ELO — Global PvP Leaderboard">
<meta property="og:description" content="Live global leaderboard for the Kill-ELO Minecraft mod.">
<meta property="og:type" content="website">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><text y='13' font-size='13'>&#9876;</text></svg>">
<style>
  :root {
    --bg: #0d1117;
    --panel: #151b24;
    --panel-2: #1b2330;
    --line: #263040;
    --text: #e6edf3;
    --muted: #8b98a9;
    --accent: #ff4d5e;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  a { color: inherit; }
  .wrap { max-width: 860px; margin: 0 auto; padding: 32px 16px 64px; }

  /* ---- Kopf ---- */
  header { text-align: center; margin-bottom: 28px; }
  h1 {
    margin: 0 0 6px;
    font-size: clamp(28px, 6vw, 42px);
    letter-spacing: -0.02em;
  }
  h1 .dot { color: var(--accent); }
  .tagline { margin: 0; color: var(--muted); font-size: 15px; }

  .cta { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-top: 18px; }
  .btn {
    display: inline-block; padding: 9px 18px; border-radius: 8px;
    background: var(--accent); color: #fff; text-decoration: none;
    font-weight: 600; font-size: 14px; border: 1px solid transparent;
    transition: filter .15s;
  }
  .btn:hover { filter: brightness(1.12); }
  .btn.ghost { background: transparent; border-color: var(--line); color: var(--text); }

  /* ---- Kennzahlen ---- */
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin: 26px 0; }
  .stat {
    background: var(--panel); border: 1px solid var(--line);
    border-radius: 10px; padding: 14px 12px; text-align: center;
  }
  .stat b { display: block; font-size: 22px; font-variant-numeric: tabular-nums; }
  .stat span { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }

  /* ---- Suche ---- */
  .search { position: relative; margin-bottom: 14px; }
  .search input {
    width: 100%; padding: 11px 14px; border-radius: 9px;
    background: var(--panel); border: 1px solid var(--line);
    color: var(--text); font-size: 15px; outline: none;
  }
  .search input:focus { border-color: var(--accent); }
  .search input::placeholder { color: var(--muted); }

  /* ---- Tabelle ---- */
  .board { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
  .row {
    display: grid;
    grid-template-columns: 46px 1fr 92px 74px 60px;
    align-items: center; gap: 10px;
    padding: 10px 14px;
    border-top: 1px solid var(--line);
  }
  .row:first-child { border-top: 0; }
  .row.head {
    background: var(--panel-2); color: var(--muted);
    font-size: 11px; text-transform: uppercase; letter-spacing: .07em;
  }
  .row:not(.head):hover { background: var(--panel-2); }
  .pos { color: var(--muted); font-variant-numeric: tabular-nums; text-align: center; }
  .pos.top { color: #ffc93c; font-weight: 700; }
  .who { display: flex; align-items: center; gap: 9px; min-width: 0; }
  .who img { width: 26px; height: 26px; border-radius: 4px; image-rendering: pixelated; background: var(--panel-2); flex: none; }
  .who .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 500; }
  .rank { font-size: 13px; font-weight: 600; }
  .elo { font-variant-numeric: tabular-nums; font-weight: 700; text-align: right; }
  .kd { font-variant-numeric: tabular-nums; color: var(--muted); font-size: 13px; text-align: right; }
  .provisional { opacity: .55; }
  .provisional .elo::after { content: " ~"; color: var(--muted); }

  .msg { padding: 40px 20px; text-align: center; color: var(--muted); }
  .more { display: block; width: 100%; padding: 12px; background: var(--panel-2);
          border: 0; border-top: 1px solid var(--line); color: var(--text);
          font: inherit; font-weight: 600; cursor: pointer; }
  .more:hover { background: #222c3b; }
  .more[hidden] { display: none; }

  footer { margin-top: 30px; text-align: center; color: var(--muted); font-size: 13px; }
  footer a { color: var(--muted); }

  @media (max-width: 560px) {
    .row { grid-template-columns: 34px 1fr 68px 56px; gap: 8px; padding: 10px; }
    .kd, .row.head .kd { display: none; }
    .rank { font-size: 12px; }
  }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <h1>Kill<span class="dot">-</span>ELO</h1>
    <p class="tagline">Global PvP ranking, built from the kill messages in chat.</p>
    <div class="cta">
      <a class="btn" href="https://modrinth.com/mod/elo-system" target="_blank" rel="noopener">Download on Modrinth</a>
      <a class="btn ghost" href="https://www.curseforge.com/minecraft/mc-mods/elo-system" target="_blank" rel="noopener">CurseForge</a>
    </div>
  </header>

  <div class="stats">
    <div class="stat"><b id="s-players">–</b><span>Players</span></div>
    <div class="stat"><b id="s-kills">–</b><span>Kills tracked</span></div>
    <div class="stat"><b id="s-top">–</b><span>Top Elo</span></div>
  </div>

  <div class="search">
    <input id="q" type="search" placeholder="Search for a player…" autocomplete="off" spellcheck="false">
  </div>

  <div class="board">
    <div class="row head">
      <div class="pos">#</div>
      <div>Player</div>
      <div class="rank">Rank</div>
      <div class="elo">Elo</div>
      <div class="kd">K / D</div>
    </div>
    <div id="rows"></div>
    <div id="msg" class="msg">Loading…</div>
    <button id="more" class="more" hidden>Load more</button>
  </div>

  <footer>
    <p>Ranks are provisional (<span style="opacity:.6">~</span>) until a player has 3 recorded fights.<br>
    Made by <a href="https://modrinth.com/user/nik2012slapshot" target="_blank" rel="noopener">nik2012slapshot</a>.</p>
  </footer>

</div>

<script>
// Gleiche Schwellen und Farben wie Rank.java in der Mod.
const RANKS = [
  { min: 2000, name: "Legend",   color: "#FF4D5E" },
  { min: 1750, name: "Champion", color: "#9B4DFF" },
  { min: 1550, name: "Master",   color: "#C77DFF" },
  { min: 1400, name: "Diamond",  color: "#4FA6FF" },
  { min: 1250, name: "Platinum", color: "#5AE6E0" },
  { min: 1100, name: "Gold",     color: "#FFC93C" },
  { min:  850, name: "Silver",   color: "#C0C7D0" },
  { min:    0, name: "Bronze",   color: "#A9714B" },
];
const rankOf = elo => RANKS.find(r => elo >= r.min) || RANKS[RANKS.length - 1];

const PAGE = 25;
const rowsEl = document.getElementById("rows");
const msgEl  = document.getElementById("msg");
const moreEl = document.getElementById("more");
const qEl    = document.getElementById("q");

let offset = 0, total = 0, query = "", busy = false;

const esc = s => String(s).replace(/[&<>"']/g, c =>
  ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

// mc-heads liefert den Kopf sowohl per UUID als auch per Name; ohne beides
// bleibt das Standardbild (Steve).
const avatar = p => "https://mc-heads.net/avatar/" +
  encodeURIComponent(p.uuid || p.name || "MHF_Steve") + "/26";

function render(players, append) {
  if (!append) rowsEl.innerHTML = "";
  for (const p of players) {
    const r = rankOf(p.elo);
    const el = document.createElement("div");
    el.className = "row" + (p.provisional ? " provisional" : "");
    el.innerHTML =
      '<div class="pos' + (p.pos <= 3 && !p.provisional ? " top" : "") + '">' + p.pos + '</div>' +
      '<div class="who"><img loading="lazy" alt="" src="' + avatar(p) + '">' +
        '<span class="name">' + esc(p.name || "unknown") + '</span></div>' +
      '<div class="rank" style="color:' + r.color + '">' + r.name + '</div>' +
      '<div class="elo">' + p.elo + '</div>' +
      '<div class="kd">' + p.kills + " / " + p.deaths + '</div>';
    rowsEl.appendChild(el);
  }
}

async function load(append) {
  if (busy) return;
  busy = true;
  moreEl.disabled = true;
  try {
    const url = "/leaderboard?limit=" + PAGE + "&offset=" + offset +
                (query ? "&q=" + encodeURIComponent(query) : "");
    const data = await fetch(url).then(r => r.json());
    total = data.total;
    render(data.players, append);
    offset += data.players.length;

    msgEl.hidden = total > 0;
    if (total === 0) {
      msgEl.textContent = query
        ? 'No player found for "' + query + '".'
        : "No ranked players yet — be the first.";
    }
    moreEl.hidden = offset >= total;
    moreEl.textContent = "Load more (" + (total - offset) + " left)";
  } catch (e) {
    msgEl.hidden = false;
    msgEl.textContent = "Leaderboard unavailable right now.";
  } finally {
    busy = false;
    moreEl.disabled = false;
  }
}

async function loadStats() {
  try {
    const s = await fetch("/stats").then(r => r.json());
    // Feste Sprache: sonst wuerde ein deutscher Browser "2.140" schreiben,
    // waehrend die Elo-Spalte daneben 2140 zeigt.
    const num = n => n.toLocaleString("en-US");
    document.getElementById("s-players").textContent = num(s.players);
    document.getElementById("s-kills").textContent   = num(s.kills);
    document.getElementById("s-top").textContent     = s.top_elo;
  } catch (e) { /* Kennzahlen sind Beiwerk, Fehler still schlucken */ }
}

moreEl.addEventListener("click", () => load(true));

// Erst tippen lassen, dann suchen - sonst eine Anfrage pro Tastendruck.
let timer;
qEl.addEventListener("input", () => {
  clearTimeout(timer);
  timer = setTimeout(() => {
    query = qEl.value.trim();
    offset = 0;
    load(false);
  }, 250);
});

load(false);
loadStats();
setInterval(loadStats, 60000);
</script>
</body>
</html>
